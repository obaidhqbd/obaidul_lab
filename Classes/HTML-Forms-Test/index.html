<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="hero">
        <p class="eyebrow">HTML + CSS PRACTICE</p>
        <h1>Student Registration</h1>
        <p>Build a semantic, accessible and responsive form without JavaScript.</p>
      </header>

      <form action="#" method="post">
        <div class="form-grid">
          <div class="field">
            <label for="full-name">Full name</label>
            <input id="full-name" name="full_name" type="text" placeholder="Obaidul Hoque" required>
          </div>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="student@example.com" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" minlength="8" placeholder="Minimum 8 characters" required>
          </div>
          <div class="field">
            <label for="birth-date">Date of birth</label>
            <input id="birth-date" name="birth_date" type="date">
          </div>
          <fieldset class="field">
            <legend>Learning level</legend>
            <label class="choice"><input type="radio" name="level" value="beginner" checked> Beginner</label>
            <label class="choice"><input type="radio" name="level" value="intermediate"> Intermediate</label>
          </fieldset>
          <div class="field">
            <label for="topic">Favorite topic</label>
            <select id="topic" name="topic">
              <option value="">Choose one</option>
              <option>HTML</option>
              <option>CSS</option>
              <option>Responsive Design</option>
              <option>Flexbox</option>
            </select>
          </div>
        </div>

        <label class="choice terms">
          <input type="checkbox" name="terms" required>
          I understand that this is a practice form.
        </label>

        <button type="submit">Create registration</button>
      </form>
    </section>
  </main>
</body>
</html>
